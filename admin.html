<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Location Dashboard</title>
<style>
body{font-family:system-ui;margin:0;background:#f5f5f5;color:#222}.wrap{max-width:900px;margin:auto;padding:24px}
.card{background:white;border-radius:16px;padding:20px;margin-bottom:16px;box-shadow:0 5px 20px #00000010}
h1{margin-top:0}table{width:100%;border-collapse:collapse}th,td{text-align:left;padding:10px;border-bottom:1px solid #eee;font-size:14px}
a{color:#1565c0}.muted{color:#666}
</style></head><body><div class="wrap"><div class="card">
<h1>Authorized Location Dashboard</h1><p class="muted">Only locations voluntarily shared through the public page are shown.</p>
<table><thead><tr><th>Time</th><th>Latitude</th><th>Longitude</th><th>Accuracy</th><th>Map</th></tr></thead>
<tbody id="rows"><tr><td colspan="5">Loading…</td></tr></tbody></table>
</div></div>
<script>
const token=new URLSearchParams(location.search).get('token');
async function load(){
 if(!token){document.getElementById('rows').innerHTML='<tr><td colspan="5">Missing admin token.</td></tr>';return}
 const r=await fetch('/.netlify/functions/location?token='+encodeURIComponent(token));
 const data=await r.json();
 if(!r.ok){document.getElementById('rows').innerHTML='<tr><td colspan="5">Unauthorized.</td></tr>';return}
 document.getElementById('rows').innerHTML=data.map(x=>`<tr>
 <td>${new Date(x.timestamp).toLocaleString()}</td><td>${Number(x.lat).toFixed(6)}</td>
 <td>${Number(x.lon).toFixed(6)}</td><td>${Math.round(x.accuracy)} m</td>
 <td><a target="_blank" rel="noopener" href="https://www.google.com/maps?q=${encodeURIComponent(x.lat+','+x.lon)}">Open Google Maps</a></td>
 </tr>`).join('') || '<tr><td colspan="5">No locations shared yet.</td></tr>';
}
load();
</script></body></html>
